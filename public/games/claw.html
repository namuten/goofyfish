<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Claw Grab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px; display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #coins, #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 28px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endBest { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; }
    #score { font-size: 38px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="stat"><div id="score">0</div><div class="label">Score</div></div>
    <div class="stat"><div id="coins">10</div><div class="label">Coins</div></div>
    <div class="stat"><div id="best">0</div><div class="label">Best</div></div>
  </div>
</div>

<div id="hint" class="hidden"><span>Hold to move the claw, let go to drop</span><span class="kbd-only">or hold</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18M12 3v6"/><rect x="9" y="9" width="6" height="3" rx="1"/><path d="M9.5 12l-3 4 2 4M14.5 12l3 4-2 4"/></svg></div>
    <h1 class="title">Claw Grab</h1>
    <div class="keys"><kbd>Hold</kbd> to slide the claw, let go to drop</div>
    <p class="tag">Ten coins. Crowned plushies are worth three. A dead-centre grab wins a coin back.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Play</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label">Round over</div>
      <span class="chip" id="endChip" style="display:none">New best</span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Score</div></div>
      <div><div id="endBest">0</div><div class="label">Best</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Play again</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'claw';
const GAME = 'Claw Grab';
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// Shared building blocks, copied from references/snippets.js. Keep what you use, delete the rest.

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Fitting the world to any screen ────────────────────────────────────────
// Design the game in fixed world units (a VIEW box), then scale it to fit the screen, leaving room for the HUD.
// Draw with ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * cam.y) and world coordinates.
// Portrait phones can't fit the whole width at a readable size, so they show at least minW world units
// centred on focusX (put the action there), and things off to the side scroll or roll into view.

const VIEW = { x0: -235, x1: 235, y0: -340, y1: 20, minW: 462, focusX: 0 };
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, x: 0, y: 0 };

function fitView() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = innerWidth;
  ch = innerHeight;
  const narrow = cw < ch;
  const top = narrow ? 150 : 110;
  const bottom = 64;
  const vw = VIEW.x1 - VIEW.x0, vh = VIEW.y1 - VIEW.y0;
  const fitH = (ch - top - bottom) / vh;
  const s = narrow ? Math.min(fitH, cw / VIEW.minW, 1.75) : Math.min((cw - 120) / vw, fitH, 1.75);
  const centre = narrow ? VIEW.focusX : (VIEW.x0 + VIEW.x1) / 2;
  cam = {
    s,
    x: cw / 2 - centre * s,
    y: top + (ch - top - bottom - vh * s) * (narrow ? 0.85 : 0.6) - VIEW.y0 * s,
  };
}
function toWorld(px, py) {
  return [(px - cam.x) / cam.s, (py - cam.y) / cam.s];
}

// ── Stick figure ───────────────────────────────────────────────────────────
// Poses are joint positions in figure space: facing right, feet near y = -8, head near y = -121.
// Draw at (x, groundY + 8) so the feet touch the ground. Needs: Helpers, strokePath, COL.fig.
// Make new poses with mk({...}) by moving a few joints of BASE; play them with an Actor.

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.stand = mk({});
P.ready = mk({ head: [2, -121], hF: [15, -84], eF: [5, -71], hB: [-4, -56], eB: [-6, -77] });
P.crouch = mk({ head: [6, -100], chest: [4, -76], hip: [-2, -46], kF: [24, -30], kB: [12, -28], hF: [16, -60], eF: [10, -56], hB: [-8, -52], eB: [-8, -60] });
P.leap = mk({ head: [4, -124], chest: [2, -99], hip: [0, -68], fF: [14, -30], fB: [-14, -26], kF: [20, -52], kB: [-2, -48], hF: [18, -140], eF: [16, -120], hB: [-14, -134], eB: [-12, -116] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-12, -134], eF: [14, -118], eB: [-12, -116] });
P.wince = mk({ head: [-3, -118], chest: [-2, -94], hip: [0, -65], kF: [20, -37], hF: [7, -125], eF: [19, -111], hB: [-7, -125], eB: [-20, -109] });
P.phew = mk({ head: [-1, -120], chest: [-1, -95], hip: [0, -65], hF: [13, -80], eF: [4, -68], hB: [2, -122], eB: [-14, -106] });
P.punch = mk({ head: [8, -118], chest: [6, -94], hip: [0, -64], kF: [24, -36], kB: [-8, -34], fF: [18, -8], fB: [-16, -8], hF: [44, -98], eF: [26, -96], hB: [2, -88], eB: [-6, -78] });

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

// Joints only bend the way real ones do, in the figure's own facing-right space (y down):
// an elbow folds the forearm toward the front of the body (ARM_BEND), a knee folds the shin back (KNEE_BEND).
// Pass the bend as the last argument; the hint then only matters when the limb is almost straight.
const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  // Ease into full extension so a straightening limb's joint doesn't race across the last few units.
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function pathPose(list, u) {
  const n = list.length - 1;
  const x = Math.min(n - 1e-6, Math.max(0, u * n));
  const i = Math.floor(x), t = x - i;
  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  return o;
}

// An Actor plays queued pose steps: actor.push({ pose: P.crouch, d: 0.12 }, { pose: P.leap, d: 0.2, ez: 'out' }).
// A step can also be { path: [P.a, P.b, P.c], d } for a smooth curve through several poses, or { fn: () => {} } to run code.
class Actor {
  constructor(pose) {
    this.pose = pose || P.ready;
    this.q = [];
    this.step = null;
    this.t = 0;
    this.id = Math.random().toString(36).slice(2);
  }
  push(...steps) {
    this.q.push(...steps);
  }
  clear() {
    this.q = [];
    this.step = null;
  }
  get idle() {
    return !this.step && !this.q.length;
  }
  update(dt) {
    for (let guard = 0; guard < 20; guard++) {
      if (!this.step) {
        if (!this.q.length) {
          return;
        }
        this.step = this.q.shift();
        this.t = 0;
        if (this.step.fn) {
          const fn = this.step.fn;
          this.step = null;
          fn();
          continue;
        }
        const targets = this.step.path || (this.step.pose ? [this.step.pose] : [this.pose]);
        this.step.list = [this.pose, ...targets];
      }
      this.t += dt;
      const s = this.step;
      const k = Math.min(1, this.t / s.d);
      this.pose = pathPose(s.list, (EASE[s.ez] || EASE.soft)(k));
      if (k < 1) {
        return;
      }
      dt = this.t - s.d;
      this.step = null;
    }
  }
}

// A back hand resting low under the shoulder hangs from a nearly straight arm, the way a relaxed arm does.
// Set hang: 0 on a pose when the back hand has to work there (it blends between poses like any number).
function relax(sh, t, amount) {
  const dx = t[0] - sh[0], dy = t[1] - sh[1];
  const d = Math.hypot(dx, dy);
  const want = (UARM + FARM) * 0.96;
  if (dy <= 0 || d < 1 || d >= want) {
    return t;
  }
  const w = (amount ?? 1) * Math.min(1, Math.max(0, (dy / d - 0.8) / 0.18));
  const k = w * w * (3 - 2 * w);
  const nd = d + (want - d) * k;
  return [sh[0] + (dx / d) * nd, sh[1] + (dy / d) * nd];
}
function reach(a, b, max) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.hypot(dx, dy);
  if (d <= max) {
    return b;
  }
  return [a[0] + (dx / d) * max, a[1] + (dy / d) * max];
}
function breathe(p, amt) {
  if (!amt) {
    return p;
  }
  const o = Object.assign({}, p);
  const up = (v, k) => [v[0], v[1] - amt * k];
  o.head = up(p.head, 1);
  o.chest = up(p.chest, 0.85);
  o.hF = up(p.hF, 0.6);
  o.hB = up(p.hB, 0.6);
  return o;
}
const prevJ = {};
function mirrorJoint(a, b, j) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1;
  const t = ((j[0] - a[0]) * dx + (j[1] - a[1]) * dy) / L2;
  const px = a[0] + dx * t, py = a[1] + dy * t;
  return [2 * px - j[0], 2 * py - j[1]];
}
function ikC(key, a, b, l1, l2, hint, bend) {
  const j = ik(a, b, l1, l2, hint, bend);
  if (bend) {
    prevJ[key] = j;
    return j;
  }
  const pj = prevJ[key];
  if (pj) {
    const alt = mirrorJoint(a, b, j);
    const dj = Math.hypot(j[0] - pj[0], j[1] - pj[1]);
    const da = Math.hypot(alt[0] - pj[0], alt[1] - pj[1]);
    const dh = Math.hypot(j[0] - hint[0], j[1] - hint[1]) - Math.hypot(alt[0] - hint[0], alt[1] - hint[1]);
    if (da + 1.5 < dj && Math.abs(dh) < 4) {
      prevJ[key] = alt;
      return alt;
    }
  }
  prevJ[key] = j;
  return j;
}
// Figure styles: pick one for the whole game with FIG_STYLE, or per figure with opts.style.
// See references/figure-styles.png. Poses, props and pnpm game:motion work the same in every style.
//   classic      solid head, thick torso, grey far limbs: the house hero
//   doodle       big hollow round head with two line eyes on a thin, even stick body
//   doodleshirt  doodle in a shirt; opts.shirt sets the colour (team colours, goons in grey)
//   sketch       hollow wobbly head and thin pen lines that redraw a few times a second

let FIG_STYLE = 'classic';
const BODY = {

  doodleshirt: { head: 1.75, arm: 1, leg: 0.92, torso: 4.8, hollow: true, sameFar: true, eyes: true, shirt: true },
  sketch: { head: 1.6, arm: 0.78, leg: 0.74, torso: 3.6, hollow: true, sameFar: true, sketch: true },

let SK = null;

// opts: { flip: true } faces left, { ink, far } recolours (goons are drawn all grey), { scale } resizes,
// { style, shirt } pick the body (see FIG_STYLE), { lw } thickens every line (icons, share images),
// { rot, pivot } tips the whole body around a point in figure space (falls, rolls), { seed } varies sketch lines,

// J gives the joints in figure space: head (centre), hr (head radius), k (head scale for hats), chest, hip,

// ── Ink drawing ────────────────────────────────────────────────────────────
// Ground is a wobbly line at y = 0 in world space, never a filled floor.

// ── Popups, particles and shake ────────────────────────────────────────────
// popup('Perfect!', 'CHAIN ×2', true) over the action; burst() for hits; dust() for landings.

const popups = [];

// kick() on big moments; offset the camera by `shake` pixels in render().
function kick(amount) {

}
function updateFx(dt) {

    }
  }

    const b = bits[i];
    b.t += dt;
    b.vy += b.g * dt;
    b.vx *= 1 - Math.min(1, b.drag * dt);
    b.x += b.vx * dt;

    const y = p.y - 26 - 24 * EASE.out(Math.min(1, k * 1.3));
    const sc = 1 + 0.22 * Math.max(0, 1 - k * 5);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = "400 24px 'Balsamiq Sans', system-ui, sans-serif";
    let half = ctx.measureText(p.text).width / 2;
    if (p.sub) {
      ctx.font = "400 10px 'Balsamiq Sans', system-ui, sans-serif";
      half = Math.max(half, ctx.measureText(p.sub).width / 2 + p.sub.length * 0.75);
    }
    half = half * sc + 10;
    const x = right - left > half * 2 ? clamp(p.x, left + half, right - half) : (left + right) / 2;
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    ctx.fillStyle = p.hot ? COL.accent : COL.ink;
    ctx.font = "400 24px 'Balsamiq Sans', system-ui, sans-serif";
    ctx.fillText(p.text, 0, 0);

// ── Sound ──────────────────────────────────────────────────────────────────
// Everything is synthesized. Call audio() inside the first tap/key handler (browsers block sound before that).

      bus.connect(comp);
      const len = Math.floor(actx.sampleRate * 1.1);

      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {

        }

      const conv = actx.createConvolver();
      conv.buffer = ir;
      verb = actx.createGain();

// A starter set; tune pitches and volumes to the game.

    [523, 659, 784, 1047].forEach((f, i) => {

};

const Q = new URLSearchParams(location.search);

window.__bot = BOT;

function gauss(r) {

}


// ── Claw Grab ──────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
window.__freeze = Q.has('still');

// Cabinet layout in world units (y up is negative, ground at 0).
const CAB = { x0: -150, x1: 210, top: -296, floor: -50 };
const CHUTE = { x0: -146, x1: -86, rim: -84 };
const RAIL_Y = -278;
const HOME_X = -116;
const MAX_X = 196;
const TIP_UP = -224;
const HERO_X = -198;
const BTN = { x: -166, y: -80 };
const PS = 0.72; // plushie scale
const SLOTS = Array.from({ length: 6 }, (_, i) => -50 + i * 47);
const START_COINS = 10;
const G = 1500;

Object.assign(SND, {
  coin() {

// Hero poses (facing right, at the button).
P.wait = mk({ head: [4, -121], hF: [31, -86], eF: [14, -80], hB: [24, -82], eB: [8, -76], hang: 0 });
P.press = mk({ head: [9, -118], chest: [6, -94], hip: [0, -65], kB: [8, -37], hF: [33, -80], eF: [19, -77], hB: [27, -77], eB: [12, -72], hang: 0 });
P.watch = mk({ head: [3, -122], chest: [1, -96], hF: [27, -86], eF: [12, -78], hB: [22, -84], eB: [6, -76], hang: 0 });
// Plushie poses: sitting in the pile, and dangling by the head with arms flailing.
P.sit = mk({ head: [6, -64], chest: [4, -39], hip: [0, -11], fF: [42, -8], fB: [36, -10], kF: [22, -26], kB: [18, -24], hF: [24, -27], eF: [14, -30], hB: [20, -26], eB: [10, -28], hang: 0 });
P.sitReach = mk({ head: [6, -64], chest: [4, -40], hip: [0, -11], fF: [42, -8], fB: [36, -10], kF: [22, -26], kB: [18, -24], hF: [40, -52], eF: [22, -48], hB: [36, -48], eB: [20, -45], hang: 0 });
P.dangleA = mk({ head: [0, -121], chest: [0, -96], hip: [0, -65], fF: [6, -9], fB: [-4, -11], kF: [10, -37], kB: [2, -38], hF: [16, -134], eF: [14, -116], hB: [-10, -132], eB: [-12, -114] });
P.dangleB = mk({ head: [0, -121], chest: [0, -96], hip: [0, -65], fF: [-2, -10], fB: [10, -12], kF: [6, -38], kB: [12, -38], hF: [22, -120], eF: [16, -104], hB: [-4, -126], eB: [-14, -110] });

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(SLUG + '.' + k);
      return v === null ? d : JSON.parse(v);
    } catch (e) {
      return d;
    }
  },
  set(k, v) {
    if (TEST) {
      return;
    }
    try {
      localStorage.setItem(SLUG + '.' + k, JSON.stringify(v));
    } catch (e) {
      return;
    }
  },
};
const life = Object.assign({ best: 0, games: 0, prizes: 0, perfects: 0, seenHint: false }, TEST ? {} : store.get('life', {}));

function resize() {
  fitView();
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
}
addEventListener('resize', resize);
resize();

let mode = 'menu';
let clock = 0, runTime = 0;
const hero = new Actor(P.wait);
function act(...steps) {
  hero.q = steps;
}
const claw = { x: HOME_X, vx: 0, tip: TIP_UP, state: 'idle', t: 0, open: 1, target: TIP_UP, held: null, slipAt: null, nextTick: 0 };
let prizes = [];
let score = 0, coins = START_COINS, used = 0, won = 0, streak = 0, perfects = 0, lastResult = null, holding = false, endTimer = 0;

const sitHeadY = CAB.floor - PS * (64 - 8);
const rng = mulberry(Date.now() & 0xffff);

function makePrize(slot, falling) {
  const crown = rng() < 0.2;
  const grey = !crown && rng() < 0.5;
  const p = {
    actor: new Actor(P.sit),
    slot,
    jit: (rng() - 0.5) * 8,
    flip: rng() < 0.5,
    crown,
    ink: grey ? '#8a8a8a' : COL.ink,
    far: grey ? '#c4c4c4' : FAR,
    state: falling ? 'fall' : 'sit',
    hx: 0, hy: 0, vx: 0, vy: 0, rot: 0, w: 0, land: null, bob: rng() * 6,
  };
  p.hx = slotHeadX(p, slot);
  p.hy = falling ? CAB.top + 20 : sitHeadY;
  p.land = falling ? slot : null;
  return p;
}
function slotHeadX(p, slot) {
  return SLOTS[slot] + p.jit + (p.flip ? -1 : 1) * PS * P.sit.head[0];
}
function slotTaken(i) {
  return prizes.some((p) => p.slot === i && (p.state === 'sit' || (p.state === 'fall' && p.land === i)));
}
function refill() {
  let delay = 0;
  for (let i = 0; i < SLOTS.length; i++) {
    if (!slotTaken(i)) {
      const p = makePrize(i, true);
      p.hy -= delay;
      delay += 50;
      prizes.push(p);
    }
  }
}

function startGame() {
  audio();
  mode = 'play';
  score = 0;
  coins = START_COINS;
  used = 0;
  won = 0;
  streak = 0;
  perfects = 0;
  runTime = 0;
  holding = false;
  endTimer = 0;
  prizes = SLOTS.map((_, i) => makePrize(i, false));
  Object.assign(claw, { x: HOME_X, vx: 0, tip: TIP_UP, state: 'idle', t: 0, open: 1, held: null, slipAt: null, w: 0 });
  botPlan = null;
  act({ pose: P.wait, d: 0.2 });
  $('overlay').classList.remove('on');
  $('hud').classList.remove('hidden');
  $('hint').classList.toggle('hidden', life.seenHint || BOT);
  updateHud();
}

function endGame() {
  mode = 'over';
  life.games++;
  const isBest = score > life.best;
  life.best = Math.max(life.best, score);
  life.prizes += won;
  life.perfects += perfects;
  store.set('life', life);
  lastResult = { score, isBest, won, perfects, time: runTime };
  window.__lastRun = lastResult;
  if (isBest && score > 0) {
    SND.record();
  }
  act({ pose: won ? P.cheer : P.phew, d: 0.55 });
  setTimeout(() => {
    $('endScore').textContent = score;
    $('endBest').textContent = life.best;
    $('endChip').style.display = isBest && score > 0 ? '' : 'none';
    $('endFoot').innerHTML = `${won} ${won === 1 ? 'plushie' : 'plushies'} · ${perfects} perfect ${perfects === 1 ? 'grab' : 'grabs'}<br>` + lifetimeLine();
    $('startCard').classList.remove('show');
    $('endCard').classList.add('show');
    $('overlay').classList.add('on');
    $('hud').classList.add('hidden');
    $('hint').classList.add('hidden');
  }, 800);
}

function lifetimeLine() {
  if (!life.games) {
    return '';
  }
  return `Best ${life.best} · ${life.games} ${life.games === 1 ? 'game' : 'games'} · ${life.prizes.toLocaleString()} plushies won`;
}

function bump(id, v) {
  const el = $(id);
  if (el.textContent !== String(v)) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  el.textContent = v;
}
function updateHud() {
  bump('score', score);
  $('coins').textContent = coins;
  $('best').textContent = Math.max(life.best, score);
}

// ── Input: hold to slide, let go to drop ──

function moveSpeed() {
  return 120 + used * 9;
}
function press() {
  audio();
  if (mode !== 'play' || claw.state !== 'idle' || coins <= 0) {
    return;
  }
  holding = true;
  coins--;
  used++;
  claw.state = 'move';
  claw.nextTick = 0;
  SND.coin();
  // Replacing the queue keeps the current step, so start from where that step ends up.
  const cur = hero.step ? hero.step.pose || hero.step.path[hero.step.path.length - 1] : null;
  const calm = cur ? cur === P.wait || cur === P.press || cur === P.watch : Math.hypot(hero.pose.hB[0] - P.wait.hB[0], hero.pose.hB[1] - P.wait.hB[1]) < 12;
  act(calm ? { pose: P.press, d: 0.2 } : { path: [P.wait, P.press], d: 0.6 });
  updateHud();
}
function release() {
  holding = false;
  if (mode !== 'play' || claw.state !== 'move') {
    return;
  }
  drop();
}
function drop() {
  claw.state = 'drop';
  claw.vx = 0;
  const near = nearestSit(claw.x);
  claw.target = near && near.d < 30 ? near.p.hy - 1 : CAB.floor - 12;
  SND.whoosh();
  act({ pose: P.watch, d: 0.35 });
  if (!life.seenHint) {
    life.seenHint = true;
    store.set('life', life);
    $('hint').classList.add('hidden');
  }
}
function nearestSit(x) {
  let best = null;
  for (const p of prizes) {
    if (p.state !== 'sit') {
      continue;
    }
    const d = Math.abs(p.hx - x);
    if (!best || d < best.d) {
      best = { p, d };
    }
  }
  return best;
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  press();
});
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', release);
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'ArrowDown') {
    return;
  }
  e.preventDefault();
  if (e.repeat) {
    return;
  }
  if (mode !== 'play') {
    if (mode === 'menu' || $('endCard').classList.contains('show')) {
      startGame();
    }
    return;
  }
  press();
});
addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') {
    release();
  }
});
addEventListener('contextmenu', (e) => e.preventDefault());
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('shareBtn').addEventListener('click', () => share(lastResult));

// ── Bot: picks a plushie, slides, lets go a little early or late ──

const botRng = mulberry(7);
let botPlan = null;
function bot(dt) {
  if (claw.state === 'idle' && coins > 0 && !botPlan) {
    const sits = prizes.filter((p) => p.state === 'sit');
    if (!sits.length) {
      return;
    }
    const crowns = sits.filter((p) => p.crown);
    const pick = crowns.length && botRng() < 0.6 ? crowns[Math.floor(botRng() * crowns.length)] : sits[Math.floor(botRng() * sits.length)];
    const err = gauss(botRng) * (7 + used * 0.7);
    botPlan = { p: pick, err, wait: 0.35 + botRng() * 0.4 };
  }
  if (!botPlan) {
    return;
  }
  if (claw.state === 'idle') {
    botPlan.wait -= dt;
    if (botPlan.wait <= 0) {
      press();
    }
  } else if (claw.state === 'move') {
    if (claw.x >= botPlan.p.hx + botPlan.err) {
      release();
      botPlan = null;
    }
  } else {
    botPlan = null;
  }
}

// ── Update ──

function grab() {
  const near = nearestSit(claw.x);
  const d = near ? near.d : 99;
  claw.slipAt = null;
  if (d <= 6) {
    takePrize(near.p);
    perfects++;
    coins++;
    popup('Perfect!', '+1 COIN', true, claw.x, claw.tip - 30);
    SND.perfect();
    updateHud();
  } else if (d <= 22) {
    takePrize(near.p);
    const hold = 1 - ((d - 6) / 16) * 0.7;
    if (rng() > hold) {
      claw.slipAt = rng() < 0.55 ? { phase: 'lift', at: lerp(claw.tip, TIP_UP, 0.25 + rng() * 0.6) } : { phase: 'return', at: lerp(claw.x, HOME_X + 70, rng()) };
    }
  } else if (d <= 30) {
    popup('Bonk', '', false, claw.x, claw.tip - 30);
    SND.tok(1);
    near.p.bob = 0;
    near.p.wob = 1;
    streak = 0;
  } else {
    popup('Missed', '', false, claw.x, claw.tip - 30);
    streak = 0;
  }
  SND.clack();
  buzz(15);
}
function takePrize(p) {
  claw.held = p;
  p.state = 'held';
  p.slot = -1;
  p.snap = 0;
  p.w = 0;
  p.rot = 0;
  p.actor.clear();
  p.actor.push({ path: [P.sitReach, P.dangleA], d: 0.45 });
  SND.squeak();
}
function slip() {
  const p = claw.held;
  claw.held = null;
  claw.slipAt = null;
  // Fall to the nearest free slot.
  let bestI = -1, bestD = 1e9;
  for (let i = 0; i < SLOTS.length; i++) {
    if (slotTaken(i)) {
      continue;
    }
    const d = Math.abs(SLOTS[i] - p.hx);
    if (d < bestD) {
      bestD = d;
      bestI = i;
    }
  }
  p.state = 'fall';
  p.land = bestI;
  p.slot = bestI;
  p.vy = 0;
  const t = Math.sqrt((2 * Math.max(10, sitHeadY - p.hy)) / G);
  p.vx = (slotHeadX(p, bestI) - p.hx) / t;
  p.actor.clear();
  p.actor.push({ path: [P.sitReach, P.sit], d: 0.5 });
  popup('Slipped!', '', false, p.hx, p.hy - 20);
  SND.slip();
  streak = 0;
  act({ pose: P.wince, d: 0.45 }, { pose: P.wince, d: 0.4 }, { pose: P.wait, d: 0.5 });
}
function prizeWon(p) {
  won++;
  streak++;
  const mult = streak >= 3 ? 2 : 1;
  const pts = (p.crown ? 3 : 1) * mult;
  score += pts;
  popup(`+${pts}`, mult > 1 ? `${streak} IN A ROW ×2` : p.crown ? 'CROWN' : '', p.crown || mult > 1, (CHUTE.x0 + CHUTE.x1) / 2, CAB.floor - 40);
  SND.thunk(0.7);
  if (mult > 1 || p.crown) {
    SND.streak(mult > 1 ? 6 : 3);
  }
  kick(60);
  buzz(25);
  act({ pose: P.cheer, d: 0.55 }, { pose: P.cheer, d: 0.45 }, { pose: P.wait, d: 0.5 });
  updateHud();
}

function updateClaw(dt) {
  const c = claw;
  const vx0 = c.vx;
  c.t += dt;
  if (c.state === 'move') {
    c.vx = moveSpeed();
    c.x += c.vx * dt;
    c.nextTick -= dt;
    if (c.nextTick <= 0) {
      SND.tick();
      c.nextTick = 0.11;
    }
    if (c.x >= MAX_X) {
      c.x = MAX_X;
      holding = false;
      drop();
    }
  } else if (c.state === 'drop') {
    c.tip = Math.min(c.target, c.tip + 300 * dt);
    if (c.tip >= c.target) {
      c.state = 'close';
      c.t = 0;
    }
  } else if (c.state === 'close') {
    c.open = Math.max(0, 1 - c.t / 0.22);
    if (c.t >= 0.22) {
      grab();
      c.state = 'lift';
      c.t = 0;
    }
  } else if (c.state === 'lift') {
    if (c.t > 0.15) {
      c.tip = Math.max(TIP_UP, c.tip - 210 * dt);
    }
    if (c.held && c.slipAt && c.slipAt.phase === 'lift' && c.tip <= c.slipAt.at) {
      slip();
    }
    if (c.tip <= TIP_UP) {
      c.state = 'return';
      c.t = 0;
      if (!c.held && c.open < 1) {
        act({ pose: P.phew, d: 0.4 }, { pose: P.wait, d: 0.4 });
      }
    }
  } else if (c.state === 'return') {
    c.vx = -230;
    c.x = Math.max(HOME_X, c.x + c.vx * dt);
    if (c.held && c.slipAt && c.slipAt.phase === 'return' && c.x <= c.slipAt.at) {
      slip();
    }
    if (c.x <= HOME_X) {
      c.vx = 0;
      c.state = 'open';
      c.t = 0;
    }
  } else if (c.state === 'open') {
    c.open = Math.min(1, c.t / 0.2);
    if (c.held && c.t > 0.08) {
      const p = c.held;
      c.held = null;
      p.state = 'chute';
      p.vy = 0;
      p.vx = 0;
      SND.whoosh();
    }
    if (c.t >= 0.6) {
      c.state = 'idle';
      c.t = 0;
      refill();
    }
  }
  // The held plushie swings when the claw starts and stops.
  const p = c.held;
  if (p) {
    p.w += ((vx0 - c.vx) * 0.012);
    p.w += (-34 * p.rot - 2.2 * p.w) * dt;
    p.rot += p.w * dt;
    p.snap = Math.min(1, (p.snap || 0) + dt / 0.25);
    const k = EASE.soft(p.snap);
    p.hx = lerp(p.hx, c.x, k);
    p.hy = lerp(p.hy, c.tip + 2, k);
    if (p.actor.idle) {
      p.actor.push({ pose: Math.round(clock * 7) % 2 ? P.dangleB : P.dangleA, d: 0.14 });
    }
  }
}

function updatePrizes(dt) {
  for (const p of prizes) {
    p.actor.update(dt);
    if (p.wob) {
      p.wob = Math.max(0, p.wob - dt * 2);
    }
    if (p.state === 'fall') {
      p.vy += G * dt;
      p.hy += p.vy * dt;
      p.hx += p.vx * dt;
      p.rot *= 1 - Math.min(1, dt * 6);
      if (p.hy >= sitHeadY) {
        p.hy = sitHeadY;
        p.hx = slotHeadX(p, p.land);
        p.slot = p.land;
        p.state = 'sit';
        p.rot = 0;
        p.wob = 0.8;
        SND.flop();
        dust(SLOTS[p.land] + p.jit, CAB.floor, 30, 5);
      }
    } else if (p.state === 'chute') {
      p.vy += G * dt;
      p.hy += p.vy * dt;
      p.rot *= 1 - Math.min(1, dt * 6);
      if (p.hy > CAB.floor + 40) {
        p.state = 'gone';
        prizeWon(p);
      }
    }
  }
  prizes = prizes.filter((p) => p.state !== 'gone');
}

function update(dt) {
  clock += dt;
  hero.update(dt);
  updateFx(dt);
  if (mode !== 'play') {
    updatePrizes(dt);
    return;
  }
  runTime += dt;
  if (BOT) {
    bot(dt);
  }
  updateClaw(dt);
  updatePrizes(dt);
  if (coins <= 0 && claw.state === 'idle' && !prizes.some((p) => p.state === 'chute' || p.state === 'held')) {
    endTimer += dt;
    if (endTimer > 0.5) {
      endGame();
    }
  }
}

// ── Drawing ──

function drawCrown(J) {
  const hc = J.head, r = J.hr;
  const y = hc[1] - r * 0.75;
  ctx.beginPath();
  ctx.moveTo(hc[0] - r * 0.85, y);
  ctx.lineTo(hc[0] - r * 0.95, y - r * 0.95);
  ctx.lineTo(hc[0] - r * 0.4, y - r * 0.45);
  ctx.lineTo(hc[0], y - r * 1.15);
  ctx.lineTo(hc[0] + r * 0.4, y - r * 0.45);
  ctx.lineTo(hc[0] + r * 0.95, y - r * 0.95);
  ctx.lineTo(hc[0] + r * 0.85, y);
  ctx.closePath();
  ctx.fillStyle = '#fcd34d';
  ctx.fill();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = COL.ink;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawPrize(p) {
  const pose = p.actor.pose;
  const fs = p.flip ? -1 : 1;
  const opts = { scale: PS, flip: p.flip, style: 'googly', ink: p.ink, far: p.far, lw: 1.2, over: p.crown ? drawCrown : null };
  if (p.state === 'sit') {
    const wob = p.wob ? Math.sin(clock * 30) * 0.12 * p.wob : 0;
    if (wob) {
      opts.rot = wob;
      opts.pivot = [0, -8];
    }
    contactShadow(SLOTS[p.slot] + p.jit + fs * 12, 20, 0.08, CAB.floor);
    drawFigure(p.actor, SLOTS[p.slot] + p.jit, CAB.floor + 8 * PS, 0, opts);
    return;
  }
  opts.rot = p.rot * fs;
  opts.pivot = pose.head;
  drawFigure(p.actor, p.hx - PS * pose.head[0] * fs, p.hy - PS * pose.head[1], 0, opts);
}

function drawClaw() {
  const c = claw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Rail and carriage.
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2;
  line(CAB.x0 + 6, RAIL_Y, CAB.x1 - 6, RAIL_Y);
  roundRect(c.x - 16, RAIL_Y - 7, 32, 14, 4);
  inkShape('#fff', 2);
  // Cable.
  const hubY = c.tip - 22;
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.6;
  line(c.x, RAIL_Y + 7, c.x, hubY - 8);
  // Hub.
  roundRect(c.x - 11, hubY - 9, 22, 12, 4);
  inkShape('#d6dde7', 2);
  // Three prongs: open swings them out.
  const o = c.open;
  for (const s of [-1, 1]) {
    const a = s * (0.15 + o * 0.55);
    const bx = c.x + s * 7, by = hubY + 2;
    const mx = bx + Math.sin(a) * 14 + s * 3, my = by + Math.cos(a) * 12;
    const tx = mx - s * (5 - o * 2), ty = my + 12 - o * 3;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 5.2;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(mx, my);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.strokeStyle = '#d6dde7';
    ctx.lineWidth = 2.4;
    ctx.stroke();
  }
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 3;
  line(c.x, hubY + 2, c.x, hubY + 10 + (1 - o) * 4);
}

function drawCabinet() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Header.
  roundRect(CAB.x0 - 8, CAB.top - 38, CAB.x1 - CAB.x0 + 16, 40, 10);
  inkShape('#fff', 2.2);
  for (let i = 0; i < 9; i++) {
    const x = CAB.x0 + 14 + i * ((CAB.x1 - CAB.x0 - 28) / 8);
    ctx.beginPath();
    ctx.arc(x, CAB.top - 18, 4.2, 0, Math.PI * 2);
    const lit = Math.floor(clock * 4 + i) % 3 === 0;
    inkShape(lit ? COL.butter : '#fff', 1.4);
  }
  // Glass box.
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2.2;
  ctx.strokeRect(CAB.x0, CAB.top, CAB.x1 - CAB.x0, CAB.floor - CAB.top);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 6;
  line(CAB.x1 - 70, CAB.top + 20, CAB.x1 - 120, CAB.top + 90);
  line(CAB.x1 - 46, CAB.top + 24, CAB.x1 - 70, CAB.top + 58);
}
function drawChute() {
  // Hole in the floor, walled off from the pile.
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(CHUTE.x0, CAB.floor - 2, CHUTE.x1 - CHUTE.x0, 6);
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(CHUTE.x1, CAB.floor);
  ctx.lineTo(CHUTE.x1, CHUTE.rim);
  ctx.lineTo(CHUTE.x1 + 6, CHUTE.rim);
  ctx.lineTo(CHUTE.x1 + 6, CAB.floor);
  ctx.stroke();
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2;
  line(CHUTE.x1 + 6, CAB.floor, CAB.x1, CAB.floor);
}
function drawBase() {
  roundRect(CAB.x0, CAB.floor, CAB.x1 - CAB.x0, -CAB.floor, 4);
  inkShape('#fff', 2.2);
  // Prize door.
  roundRect(CHUTE.x0 + 6, CAB.floor + 10, CHUTE.x1 - CHUTE.x0 - 12, 28, 5);
  inkShape('#f3f3f3', 1.6);
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.4;
  line(CHUTE.x0 + 14, CAB.floor + 16, CHUTE.x1 - 14, CAB.floor + 16);
  // Coin slot.
  roundRect(40, CAB.floor + 14, 22, 22, 4);
  inkShape('#fff', 1.6);
  ctx.lineWidth = 2;
  line(51, CAB.floor + 19, 51, CAB.floor + 31);
  // Button console on the left side.
  roundRect(CAB.x0 - 28, BTN.y + 4, 28, 14, 3);
  inkShape('#fff', 1.8);
  const down = claw.state === 'move' ? 3 : 0;
  ctx.beginPath();
  ctx.ellipse(BTN.x, BTN.y + 2 + down * 0.5, 9, 5 - down * 0.6, 0, 0, Math.PI * 2);
  inkShape(COL.butter, 1.8);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * (cam.y + shake));
  const left = toWorld(0, 0)[0], right = toWorld(cw, 0)[0];
  drawGround(left - 20, right + 20);
  drawCabinet();
  // Everything inside the glass is clipped to it.
  ctx.save();
  ctx.beginPath();
  ctx.rect(CAB.x0 + 1, CAB.top + 1, CAB.x1 - CAB.x0 - 2, CAB.floor - CAB.top + 6);
  ctx.clip();
  drawChute();
  for (const p of prizes) {
    if (p.state === 'sit') {
      drawPrize(p);
    }
  }
  for (const p of prizes) {
    if (p.state !== 'sit' && p.state !== 'held') {
      drawPrize(p);
    }
  }
  if (claw.held) {
    drawPrize(claw.held);
  }
  drawClaw();
  ctx.restore();
  drawBase();
  contactShadow(HERO_X, 15, 0.1);
  drawFigure(hero, HERO_X, 8, mode === 'menu' ? Math.sin(clock * 2) * 1.2 : 0);
  drawBits();
  drawPopups(left, right);
}

// ── Share image ──

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px 'Balsamiq Sans', system-ui, sans-serif`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('PERSONAL BEST', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.score), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = font(30);
  ctx.fillText('POINTS', 82, 386);
  ctx.letterSpacing = '0px';
  const stats = [[res.won, 'PLUSHIES'], [res.perfects, 'PERFECT GRABS']];
  stats.forEach(([v, l], i) => {
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.letterSpacing = '0px';
    ctx.fillText(String(v), 82 + i * 330, 560);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(l, 84 + i * 330, 600);
  });
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.fillText(GAME.toUpperCase(), 84, 1196);
  ctx.letterSpacing = '0px';
  ctx.save();
  ctx.translate(700, 1250);
  ctx.scale(2.6, 2.6);
  drawGround(-130, 130);
  contactShadow(0, 16, 0.1);
  drawFigure({ pose: P.cheer }, 0, 8, 0, { live: false });
  const n = Math.min(4, Math.max(1, res.won));
  for (let i = 0; i < n; i++) {
    const x = 40 + i * 22;
    drawFigure({ pose: P.sit }, x, 8 * PS, 0, { live: false, scale: PS, style: 'googly', lw: 1.35, flip: i % 2 === 1, over: i === 0 && res.score > res.won ? drawCrown : null });
  }
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.score}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Image saved');
  } catch (e) {
    toast('Could not save the image');
  }
}

prizes = SLOTS.map((_, i) => makePrize(i, false));
$('startFoot').innerHTML = lifetimeLine();
if (Q.has('autoplay') || BOT) {
  startGame();
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
